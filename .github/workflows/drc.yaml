name: DRC

on:
  push:
    branches: ["main"]
    paths:
      - 'design/**.mag'
      - 'info.yaml'
      - 'config.yaml'
      - 'cic/**'
      - 'work/**'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: "drc"
  cancel-in-progress: true

jobs:
  drc:
    uses: analogicus/jnw-actions/.github/workflows/drc.yaml@main
